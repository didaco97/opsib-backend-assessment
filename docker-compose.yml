services:
  db:
    image: postgres:16
    environment:
      # Credentials come from your shell / .env (see .env.example) - never hard-code them.
      POSTGRES_USER: ${POSTGRES_USER:-opsib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before running docker compose}
      POSTGRES_DB: ${POSTGRES_DB:-opsib}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20
